<app-breadcrumb [title]="'My Profile'" [items]="['Profile']" [active_item]="'My Profile'"></app-breadcrumb>
<div class="card">
    <div class="card-body">

        <!--        <div class="text-center my-3">-->
        <!--            <button class="btn btn-primary" (click)="openNoticesModal()" [disabled]="loadingNotices">-->
        <!--                <span *ngIf="loadingNotices" class="spinner-border spinner-border-sm me-1" role="status" aria-hidden="true"></span>-->
        <!--                View Special Notices-->
        <!--                <span *ngIf="notices.length > 0" class="badge bg-danger ms-2">{{ notices.length }}</span>-->
        <!--            </button>-->
        <!--            <div *ngIf="noticeError" class="text-danger small mt-1">{{ noticeError }}</div>-->
        <!--        </div>-->
        <form>
            <div class="row mb-2">
                <div class="profile-title">
                    <div class="media"><img class="img-70 rounded-circle" alt="" src="assets/images/profile-image.png  ">
                        <div class="media-body">
                            <h3 class="mb-1 f-20 txt-dark">{{user.fullName}}</h3>
                        </div>
                    </div>
                </div>
            </div>
        </form>

        <ul ngbNav #nav1="ngbNav" [activeId]="1" class="nav-tabs border-tab">
            <li [ngbNavItem]="1">
                <a ngbNavLink><i class="icofont icofont-student-alt"></i>Profile</a>
                <ng-template ngbNavContent>
                    <div class="card">
                        <div class="card-body megaoptions-border-space-sm">
                            <div class="row g-3">
                                <div class="media-body">
                                    <div class="mb-3 row">
                                        <label class="col-sm-3 col-form-label" ><b>Full Name</b></label>
                                        <label class="col-sm-3 col-form-label" >{{user.fullName}}</label>
                                    </div>
                                    <div class="mb-3 row">
                                        <label class="col-sm-3 col-form-label" ><b>NIC</b></label>
                                        <label class="col-sm-3 col-form-label" >{{user.nic}}</label>
                                    </div>
                                    <div class="mb-3 row">
                                        <label class="col-sm-3 col-form-label" ><b>Birthday</b></label>
                                        <label class="col-sm-3 col-form-label" >{{user.dob | date}}</label>

                                    </div>

                                    <div class="mb-3 row">
                                        <label class="col-sm-3 col-form-label" ><b>Gender</b></label>
                                        <label class="col-sm-3 col-form-label" >{{user.gender}}</label>
                                    </div>
<!--                                    <div class="mb-3 row">-->
<!--                                        <label class="col-sm-3 col-form-label"><b>Allergies</b></label>-->
<!--                                        <label class="col-sm-3 col-form-label">{{ user.allergies || 'None' }}</label>-->
<!--                                    </div>-->
<!--                                    <div class="mb-3 row">-->
<!--                                        <label class="col-sm-3 col-form-label"><b>Special Notice</b></label>-->
<!--                                        <label class="col-sm-3 col-form-label">{{ user.specialNotice || 'None' }}</label>-->
<!--                                    </div>-->
<!--                                    <div class="mb-3 row">-->
<!--                                        <label class="col-sm-3 col-form-label" ><b>Parent Name</b></label>-->
<!--                                        <label class="col-sm-3 col-form-label" >{{user.parentName}}</label>-->

<!--                                    </div>-->
<!--                                    <div class="mb-3 row">-->
<!--                                        <label class="col-sm-3 col-form-label" ><b>Relationship to child</b></label>-->
<!--                                        <label class="col-sm-3 col-form-label" >{{user.relationship}}</label>-->

<!--                                    </div>-->
                                    <div class="mb-3 row">
                                        <label class="col-sm-3 col-form-label" ><b>Email</b></label>
                                        <label class="col-sm-3 col-form-label" >{{user.email}}</label>

                                    </div>
                                    <div class="mb-3 row">
                                        <label class="col-sm-3 col-form-label" ><b>Contacts</b></label>
                                        <label class="col-sm-3 col-form-label" >{{user.contact}}</label>

                                    </div>
                                    <div class="mb-3 row">
                                        <label class="col-sm-3 col-form-label" ><b>Joining Date</b></label>
                                        <label class="col-sm-3 col-form-label" >{{user.joiningDate | date}}</label>

                                    </div>
                                    <div class="mb-3 row">
                                        <label class="col-sm-3 col-form-label" ><b>Salary</b></label>
                                        <label class="col-sm-3 col-form-label" >Rs.{{user.salary}}.00</label>

                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </ng-template>
            </li>
        </ul>
        <div [ngbNavOutlet]="nav1" class="mt-4"></div>
    </div>
</div>
