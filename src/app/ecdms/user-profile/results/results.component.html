            </div>

            <!-- Error Message -->
            <div *ngIf="!loading && error" class="alert alert-danger" role="alert">
                {{ error }}
                <button type="button" class="btn btn-sm btn-outline-danger ms-3" (click)="fetchStudentData()">Retry</button>
            </div>

                <!-- Academic Milestones / Test Results Card -->
                <div class="card mb-4">
                    <div class="card-header bg-info text-white d-flex justify-content-between align-items-center">
                        <h5 class="mb-0">Academic Milestones (Test Results)</h5>
                        <span class="badge bg-light text-dark">{{ studentData.testResultsDTOList?.length || 0 }} Tests</span>
                    </div>
                    <div class="card-body">
                        <div *ngIf="studentData.testResultsDTOList && studentData.testResultsDTOList.length > 0; else noTests">
                            <div class="table-responsive">
                                <table class="table table-striped table-hover">
                                    <thead class="table-light">
                                    <tr>
                                        <th scope="col">Test Name</th>
                                        <th scope="col">Marks Obtained</th>
                                        <th scope="col">Max Marks</th>
                                        <th scope="col">Status</th>
                                    </tr>
                                    </thead>
                                    <tbody>
                                    <tr *ngFor="let result of studentData.testResultsDTOList ">

                                        <td>{{ result.testName }}</td>
                                        <td>{{ result.marks }}</td>
                                        <td>{{ result.maxMark }}</td>
                                        <td>
                        <span class="badge"
                              [ngClass]="getResultBadgeClass(result.passStatus)">
                          {{ getResultStatusText(result.passStatus) }}
                        </span>
                                        </td>
                                    </tr>
                                    </tbody>
                                </table>
                            </div>

                        </div>
                        <ng-template #noTests>
                            <p class="text-muted">No test results available.</p>
                        </ng-template>
                    </div>
                </div>
            </div>
