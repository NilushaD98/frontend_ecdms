<ng-template #getContent let-modal>
    <div class="modal-header">
        <h5 class="modal-title">Special Notice</h5>
        <button type="button" class="btn-close" aria-label="Close" (click)="modal.dismiss('Cross click')"></button>
    </div>
    <div class="modal-body">
        <div class="mb-3">
            <label class="col-form-label">Allergies:</label>
            <input class="form-control" type="text" value="Test Name" [(ngModel)]="allergies" >
        </div>
        <div class="mb-3">
            <label class="col-form-label">Special Notice:</label>
            <input class="form-control" type="text" value="Test Name" [(ngModel)]="specialNotice" >
        </div>
        <div class="mb-3">
            <label class="col-form-label">Contact One:</label>
            <input class="form-control" type="text" value="Test Name" [(ngModel)]="contactOne" >
        </div>
        <div class="mb-3">
            <label class="col-form-label">Contact One:</label>
            <input class="form-control" type="text" value="Test Name" [(ngModel)]="contactTwo" >
        </div>
    </div>
    <div class="modal-footer" *ngIf="userType == 'PARENT'">
        <button class="btn btn-primary" (click)="editUser()">Save</button>
    </div>
</ng-template>

<!-- Button/Link to open the Notices Modal -->


<!-- Special Notices Modal -->
<div class="modal fade" id="noticesModal" [ngClass]="{ 'show d-block': isNoticesModalOpen }" tabindex="-1" role="dialog" aria-labelledby="noticesModalLabel" aria-hidden="!isNoticesModalOpen" [style.display]="isNoticesModalOpen ? 'block' : 'none'">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable modal-lg" role="document"> <!-- modal-lg for larger width -->
        <div class="modal-content">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title" id="noticesModalLabel">Special Notices</h5>
                <button type="button" class="btn-close btn-close-white" (click)="closeNoticesModal()" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div *ngIf="notices.length === 0 && !loadingNotices && !noticeError" class="text-center text-muted my-5">
                    No special notices found.
                </div>

                <div *ngIf="noticeError && !loadingNotices" class="alert alert-danger" role="alert">
                    {{ noticeError }}
                </div>

                <div *ngIf="loadingNotices" class="text-center my-5">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Loading notices...</span>
                    </div>
                </div>

                <!-- Notices List -->
                <div class="notices-container" *ngIf="notices.length > 0 && !loadingNotices && !noticeError">
                    <div class="notice-item mb-4 p-3 border rounded" *ngFor="let notice of notices">
                        <!-- Message -->
                        <p class="notice-message mb-2">{{ notice.message }}</p>

                        <!-- Image -->
                        <div class="notice-image-container mt-2" *ngIf="notice.displayMediaLink">
                            <!-- Use target="_blank" to open image in new tab, rel="noopener noreferrer" for security -->
                            <a [href]="notice.originalMediaLink" target="_blank" rel="noopener noreferrer">
                                <!-- Use img-fluid for responsive image, rounded for rounded corners -->
                                <img [src]="notice.displayMediaLink" [alt]="'Notice Image ' + notice.specialNoticeID" class="img-fluid rounded shadow-sm notice-image">
                            </a>
                            <!-- Optional: Add a small link below the image -->
                            <!-- <small class="d-block text-center mt-1"><a [href]="notice.originalMediaLink" target="_blank" rel="noopener noreferrer">View Full Image</a></small> -->
                        </div>

                        <!-- Optional: Display Notice ID (for debugging or reference) -->
                        <!-- <small class="text-muted">ID: {{ notice.specialNoticeID }}</small> -->
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" (click)="closeNoticesModal()">Close</button>
                <!-- Add other actions if needed, like 'Mark All as Read' -->
            </div>
        </div>
    </div>
</div>

<!-- Optional: Backdrop for modal -->
<div class="modal-backdrop fade" [ngClass]="{ 'show': isNoticesModalOpen }" *ngIf="isNoticesModalOpen" (click)="closeNoticesModal()"></div>
