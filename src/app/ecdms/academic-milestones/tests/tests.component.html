<app-breadcrumb [title]="'Tests'" [items]="['Academic Milestones']" [active_item]="'Tests'"></app-breadcrumb>
<div class="container-fluid">
    <div class="row">
        <div class="col-sm-12">
            <div class="card">
                <div class="card-body">
                    <div class="table-responsive data-table">
                        <form>
                            <div class="mb-3 row justify-content-end">
                                <div class="col-xs-1">
                                    <button class="btn btn-primary btn-air-primary" (click)="navigateAddTest(getContent)">Add Test</button>
                                </div>
                                <span class="col col-form-label text-end" *ngIf="service.loading$ | async">Loading...</span>
                                <label for="table-complete-search" class="col-xs-3 col-sm-auto col-form-label">Search:</label>
                                <div class="col-xs-3 col-sm-auto">
                                    <input id="table-complete-search" type="text" class="form-control" name="searchTerm" [(ngModel)]="service.searchTerm">
                                </div>
                            </div>

                            <table class="table table-striped table-border-vertical">
                                <thead>
                                <tr>
                                    <th scope="col" sortable="testTypeID" (sort)="onSort($event)">Test ID</th>
                                    <th scope="col" sortable="testName" (sort)="onSort($event)">Name</th>
                                    <th scope="col" sortable="testDate" (sort)="onSort($event)">Date</th>
                                    <th scope="col" sortable="testClass" (sort)="onSort($event)">Class</th>
                                    <th scope="col" >Mark</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr *ngFor="let item of basicTable$ | async">
                                    <td scope="row">
<!--                                        <img class="img-40 me-2" src="{{item.img}}" alt="">-->
                                        <ngb-highlight [result]="item.testTypeID" [term]="service.searchTerm"></ngb-highlight>
                                    </td>
                                    <td>
                                        <ngb-highlight [result]="item.testName" [term]="service.searchTerm"></ngb-highlight>
                                    </td>
                                    <td>
                                        <ngb-highlight [result]="item.testDate | date:'yyyy-MM-dd'" [term]="service.searchTerm"></ngb-highlight>
                                    </td>
                                    <td>
                                        <span class="badge bg-primary">{{ getClassNames(item.testClass) }}</span>
                                    </td>
                                    <td>
                                        <span>
                                          <i class="fa fa-eye font-primary pe-2"  (click)="viewTest(item,getContent)"></i>
                                          <span >
                                            <i class="icofont icofont-close-circled font-danger ps-2" (click)="removeTest(item)"></i>
                                          </span>
                                        </span>
                                    </td>
                                </tr>
                                </tbody>
                            </table>
                            <div class="d-flex justify-content-between mt-3">
                                <select class="form-select" style="width: auto" name="pageSize" [(ngModel)]="service.pageSize">
                                    <option [ngValue]="2">2 items per page</option>
                                    <option [ngValue]="4">4 items per page</option>
                                    <option [ngValue]="6">6 items per page</option>
                                </select>
                                <ngb-pagination
                                        [collectionSize]="(total$ | async)!" [(page)]="service.page" [pageSize]="service.pageSize">
                                </ngb-pagination>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>


<ng-template #getContent let-modal>
    <div class="modal-header">
        <h5 class="modal-title">New Test</h5>
        <button type="button" class="btn-close" aria-label="Close" (click)="modal.dismiss('Cross click')"></button>
    </div>
    <div class="modal-body">

        <div class="mb-3">
            <label class="col-form-label">Class:</label>
            <ng-select [items]="classrooms" bindLabel="name" bindValue="id"  placeholder="Select class" [(ngModel)]="selectedClass">
                    </ng-select>
        </div>
        <div class="mb-3">
            <label class="col-form-label">Test Name:</label>
            <input class="form-control" type="text" value="Test Name" [(ngModel)]="testName">
        </div>
        <div class="mb-3">
            <label class="col-form-label" >Date:</label>
            <input id="testDate" type="date" class="form-control"
                   [attr.value]="todayDate" (input)="onDateChange($event)" />
        </div>
        <div class="mb-3">
            <label class="col-form-label" >Description:</label>
            <textarea class="form-control" [(ngModel)]="description"></textarea>
        </div>
    </div>
    <div class="modal-footer">
        <button *ngIf="!editMode" (click)="addTestType()" class="btn btn-primary" type="button">Add Test</button>
        <button *ngIf="editMode" (click)="addTestType()" class="btn btn-primary" type="button">Update Test</button>
    </div>
</ng-template>
